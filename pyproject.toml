[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgui"
version = "0.2.0"
description = "Schlanke Git-Oberfläche für Linux im Stil von Fork"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PySide6"]

[project.optional-dependencies]
syntax = ["pygments"]  # Syntaxfarben im Diff

[project.scripts]
gitgui = "gitgui.app:main"  # nicht „git-gui“: so heißt schon Gits eigenes Tk-Programm

[tool.setuptools]
packages = ["gitgui"]

[tool.setuptools.package-data]
gitgui = ["icon.svg"]
